# =========================================================
# 全局上游连接池与防刷限流配置
# 部署路径: /etc/nginx/conf.d/00-gateway-common.conf
# =========================================================

# 隐藏 Nginx 版本号
server_tokens off;

# 定义上游 Keep-Alive 连接池，大幅降低高频 API 请求的本地建连开销
upstream new_api_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream uptime_kuma_backend {
    server 127.0.0.1:3001;
    keepalive 16;
}

# 针对单 IP 的速率限制与并发连接限制（防脚本恶意刷接口/打垮粉丝免费池）
# api_rate: 每秒允许 20 次请求，允许突发 40
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
# panel_rate: 登录/注册/兑换码接口防爆破，每秒 5 次
limit_req_zone $binary_remote_addr zone=panel_rate:10m rate=5r/s;
# 并发连接数限制
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# 触发限流时返回标准 429 Too Many Requests（而不是默认的 503）
limit_req_status 429;
limit_conn_status 429;

# 结构化网关日志格式（记录 TTFB / upstream_response_time，方便排障与面试展示）
log_format gateway_json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"http_user_agent":"$http_user_agent"'
'}';
